<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML5 Unique Tags Demo</title>

<style>
body{
font-family: Arial;
background:#f0f8ff;
margin:20px;
}

article{
background:rgb(42, 227, 255);
padding:20px;
border-radius:10px;
box-shadow:0 0 10px gray;
margin-bottom:20px;
}

section{
background:#52ff97;
padding:15px;
margin-top:10px;
border-radius:8px;
}

figure{
text-align:center;
}

figcaption{
font-style:italic;
color:rgb(0, 0, 0);
}

time{
color:red;
font-weight:bold;
}
</style>
</head>
<body>
<h1>Ultron News</h1>
<article>
<h2>Cybertrone News</h2>
<p>
Published on:
<time datetime="2026-02-16">16 February 2026</time>
</p>
<section>
<h3>Prime</h3>
<p>The Machine That came to Save Earth</p>
</section>
<figure>
<img src="https://i.pinimg.com/1200x/15/ac/c2/15acc2f7df9cacfd47e542a7bf716f26.jpg" style="max-width: 200px; height: auto; border-radius: 5px;">
<figcaption>
Figure 1: Movie image
</figcaption>
</figure>
</article>
</body>
</html>
