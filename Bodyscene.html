<!DOCTYPE html>
<html>
<head>
    <title>animetion...</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at center, hwb(149 0% 0%), #000000);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            overflow: hidden;
        }
        .tunnel {
            position: relative;
            width: 280px;
            height: 280px;
            transform-style: preserve-3d;
            animation: tunnelspin 14s linear infinite;
        }
        .wave {
            position: absolute;
            inset: 0;
            border: 2px solid rgb(4, 0, 255);
            transform-style: preserve-3d;
            animation: wavepulse 4s ease-in-out infinite;
        }
        .wave:nth-child(1) {transform: translatez(0px);}
        .wave:nth-child(2) {transform: translatez(-40px);}
        .wave:nth-child(3) {transform: translatez(-80px);}
        .wave:nth-child(4) {transform: translatez(-120px);}
        .wave:nth-child(5) {transform: translatez(-160px);}

        .wave::before {
            content: '';
            position: absolute;
            inset: 0;
            inset: -14;
            background: linear-gradient(135deg,rgb(5, 255, 255),transparent);
            filter: blur(18px);
            z-index: -1;
        }
        
        @keyframes wavePulse 
        0% {
            transform:translateZ(var(-z,0))scale(1);
            opacity:0.5;
        }
        50% {
            transform:translateZ(var(-z,0))scale(1.2);
            opacity:1;
        }
        100% {
            transform:translateZ(var(-z,0))scale(1);
            opacity: 0.5;
        }
        
        @keyframes tunnelspin 
        {
            from 
            {
                transform: rotateY(65deg) rotate(0deg);
            }
            to
            {
                transform: rotateY(65deg) rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="tunnel">
        <div class="wave" style="-z:0px"></div>
        <div class="wave" style="-z:40px"></div>
        <div class="wave" style="-z:80px"></div>
        <div class="wave" style="-z:120px"></div>
        <div class="wave" style="-z:160px"></div>
    </div>    
</body>
</html>
