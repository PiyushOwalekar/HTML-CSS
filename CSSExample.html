<!DOCTYPE html>
<html>
    <head>
        <title>CSS Box Model Detailed Practice</title>
        <style>
/* Light theme (default) */ 
:root {
--bg-color: #f0f0ff;
--text-color: #000000;
--card-color: #000000;
}
/*Dark thene */
.dark {
--bg-color: #121212;
--text-color: #ffffff;
--card-color: #1e1e1e;
}
body {
background-color: var(--bg-color);
color: var(--text-color);
font-family: Arial, sans-serif;
margin: 0;
padding: 20px;
transition: 0.3s;
}
.card {
background-color: var(--card-color);
padding: 20px;
border-radius: 8px;
margin-top: 20px;
}
button {
padding: 10px 15px;
cursor: pointer;
border: none;
border-radius: 5px;
}
</style>
    </head>
    <body>
        <h1>Dark/Light Theme</h1>
        <button onclick = "toggleTheme()">Toggle Theme</button>
        <div class="card">
            <p>This content changes color based on theme</p>
            </div>
            <script>
                function toggleTheme() {
            document.body.classList.toggle('dark');
            }
            </script>
            </body>
</html>
