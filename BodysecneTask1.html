<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaceship Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }

        .scene {
            height: 100vh;
            width: 100vw;
            perspective: 800px;
            perspective-origin: 50% 50%;
            animation: cameraFly 10s ease-in-out infinite alternate;
        }

        .starfield {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)), radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)), radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 150px 100px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 120px 140px, #ddd, rgba(0,0,0,0)), radial-gradient(2px 2px at 180px 10px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 10px 190px, #eee, rgba(0,0,0,0)), linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-repeat: repeat;
            background-size: 200px 200px, 200px 200px, 50px 50px, 50px 50px;
            animation: move-starfield 5s linear infinite;
            transform: translateZ(-500px);
        }

        @keyframes move-starfield {
            from {
                background-position: 0 0;
            }
            to {
                background-position: 0 200px;
            }
        }

        .ball {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, #ff4d4d, #800000);
            border-radius: 50%;
            transform-style: preserve-3d;
            transform: translate(-50%, -50%);
            animation: bounce 1.5s ease-in-out infinite;
            box-shadow: 0 50px 30px rgba(0,0,0,0.5);
        }

        @keyframes bounce {
            0%, 100% {
                transform: translate(-50%, -150%) scaleX(1) scaleY(1);
            }
            50% {
                transform: translate(-50%, 50%) scaleX(1.2) scaleY(0.8);
            }
        }

        /* Rotating 3D Cube */
        .cube-container {
            position: absolute;
            top: 20%;
            left: 20%;
            width: 60px;
            height: 60px;
            perspective: 1000px;
            animation: cubeJump 2s ease-in-out infinite;
        }
        @keyframes cubeJump {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-100px) rotateX(180deg); }
        }
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateCube 5s infinite linear;
        }
        .cube-container.in-box {
            border: 4px solid #555;
        }
        .face {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid white;
            background: rgba(255, 255, 255, 0.1);
        }
        .front  { transform: translateZ(30px); }
        .back   { transform: rotateY(180deg) translateZ(30px); }
        .right  { transform: rotateY(90deg) translateZ(30px); }
        .left   { transform: rotateY(-90deg) translateZ(30px); }
        .top    { transform: rotateX(90deg) translateZ(30px); }
        .bottom { transform: rotateX(-90deg) translateZ(30px); }

        @keyframes rotateCube {
            from { transform: rotateX(0) rotateY(0) rotateZ(0); }
            to { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
        }

        /* Pendulum */
        .pendulum {
            position: absolute;
            top: 0;
            right: 20%;
            transform-origin: top center;
            animation: swing 2s ease-in-out infinite;
        }
        .string { width: 2px; height: 150px; background: white; margin: 0 auto; }
        .bob { width: 30px; height: 30px; background: gold; border-radius: 50%; margin-top: -5px; }

        @keyframes swing {
            0%, 100% { transform: rotate(30deg); }
            50% { transform: rotate(-30deg); }
        }

        /* Solar System */
        .sun {
            position: absolute;
            bottom: 20%;
            right: 10%;
            width: 40px;
            height: 40px;
            background: orange;
            border-radius: 50%;
            box-shadow: 0 0 20px orange;
        }
        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: orbitSpin 4s linear infinite;
        }
        .planet {
            position: absolute;
            top: -5px;
            left: 50%;
            width: 10px;
            height: 10px;
            background: cyan;
            border-radius: 50%;
        }
        @keyframes orbitSpin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        /* Text Pop-Up */
        .popup-text {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 40px;
            font-weight: bold;
            text-shadow: 0 0 10px cyan, 0 0 20px cyan;
            animation: pop 2s ease-in-out infinite alternate;
        }
        @keyframes pop {
            from { transform: translateX(-50%) scale(1); opacity: 0.7; }
            to { transform: translateX(-50%) scale(1.2); opacity: 1; }
        }

        /* Logo Spin */
        .logo-spin {
            position: absolute;
            bottom: 10%;
            left: 5%;
            font-family: 'Arial Black', sans-serif;
            font-size: 30px;
            color: #00ffcc;
            transform-style: preserve-3d;
            animation: logoRotate 4s linear infinite;
        }
        @keyframes logoRotate {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        /* Opening Door */
        .door-frame {
            position: absolute;
            bottom: 50px;
            left: 50%;
            width: 60px;
            height: 100px;
            border: 2px solid #555;
            perspective: 1000px;
            transform: translateX(-50%);
        }
        .door {
            width: 100%;
            height: 100%;
            background: #4a2c2a;
            transform-origin: left;
            transition: transform 0.5s;
            animation: doorSwing 4s ease-in-out infinite;
            border: 1px solid #000;
        }
        .knob {
            position: absolute;
            right: 10px;
            top: 50%;
            width: 8px;
            height: 8px;
            background: gold;
            border-radius: 50%;
        }
        @keyframes doorSwing {
            0%, 100% { transform: rotateY(0deg); }
            50% { transform: rotateY(-110deg); }
        }

        /* Camera Fly-Through Effect */
        @keyframes cameraFly {
            0% { perspective-origin: 50% 50%; transform: scale(1); }
            50% { perspective-origin: 60% 40%; transform: scale(1.1); }
            100% { perspective-origin: 40% 60%; transform: scale(1); }
        }

        /* Domino Effect */
        .domino-row {
            position: absolute;
            bottom: 20%;
            left: 10%;
            display: flex;
            gap: 20px;
        }
        .domino {
            width: 10px;
            height: 40px;
            background: white;
            transform-origin: bottom;
            animation: dominoFall 4s infinite;
        }
        .domino:nth-child(2) { animation-delay: 0.2s; }
        .domino:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dominoFall {
            0%, 20% { transform: rotate(0deg); }
            40%, 100% { transform: rotate(70deg); }
        }

        /* Simple Car Movement */
        .car {
            position: absolute;
            bottom: 10%;
            width: 60px;
            height: 30px;
            background: red;
            border-radius: 5px;
            animation: drive 6s linear infinite;
        }
        .car::after, .car::before {
            content: '';
            position: absolute;
            bottom: -5px;
            width: 15px;
            height: 15px;
            background: #333;
            border-radius: 50%;
        }
        .car::before { left: 5px; }
        .car::after { right: 5px; }
        @keyframes drive {
            from { left: -100px; }
            to { left: 110%; }
        }

        /* Robot Walk */
        .robot {
            position: absolute;
            bottom: 15%;
            right: 30%;
            width: 40px;
            height: 60px;
        }
        .leg {
            position: absolute;
            bottom: 0;
            width: 10px;
            height: 30px;
            background: silver;
            transform-origin: top;
        }
        .leg-left { left: 5px; animation: walk 1s infinite alternate; }
        .leg-right { right: 5px; animation: walk 1s infinite alternate-reverse; }
        @keyframes walk {
            from { transform: rotate(-20deg); }
            to { transform: rotate(20deg); }
        }

    </style>
</head>
<body>
    <div class="scene">
        <div class="starfield"></div>
        
        <div class="logo-spin">GOOGLE</div>

        <div class="door-frame">
            <div class="door"><div class="knob"></div></div>
        </div>

        <div class="ball"></div>
        <div class="cube-container">
            <div class="cube">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
            </div>
        </div>
        <div class="pendulum"><div class="string"></div><div class="bob"></div></div>
        <div class="sun"><div class="orbit" style="width:100px; height:100px;"><div class="planet"></div></div></div>
        <div class="popup-text">Piyush</div>

        <div class="domino-row">
            <div class="domino"></div>
            <div class="domino"></div>
            <div class="domino"></div>
        </div>

        <div class="car"></div>

        <div class="robot">
            <div style="width:30px;height:30px;background:silver;margin:0 auto;"></div>
            <div class="leg leg-left"></div>
            <div class="leg leg-right"></div>
        </div>
    </div>
</body>
</html>
