<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --primary-color: #0080ff;
      --secondary-color: #ff1900;
      --text-color: #34495e;
    }
    h1 {
      color: var(--primary-color);
    }
    p {
      color: var(--text-color);
    }
    button {
      background-color: var(--secondary-color);
      color: rgb(94, 207, 255);
      border: none;
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
    <h1>Heading with Primary Color</h1>
    <h2>Secondary Color Heading</h2>
    <p>This paragraph uses text color from root</p>
    <button>Secondary Color Button</button>
</body>
</html>
