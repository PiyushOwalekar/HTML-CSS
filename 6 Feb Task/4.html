<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --card-bg: #00e1ff;
      --main-padding: 20px;
      --section-margin: 30px;
    }
    body {
      padding: var(--main-padding);
    }
    section {
      margin-bottom: var(--section-margin);
    }
    .card {
      background-color: var(--card-bg);
      padding: var(--main-padding);
      width: 200px;
    }
  </style>
</head>
<body>
  <section>
    <div class="card">This is a card <div>
  </section>
</body>
</html>
