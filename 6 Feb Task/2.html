<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --font-size: 20px;
      --card-bg: #87ff08;
      --card-border: #0080ff;
    }
    h1, p {
      font-size: var(--font-size);
    }
    .card {
        margin: 20px;
        padding: 20px;
        border: 2px solid var(--card-border);
        background-color: var(--card-bg);
        border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Heading</h1>
  <p>God Dammmmm Code</p>
  
  <div class="card">
    <div>Card One Content</div>
  </div>

  <div class="card">
    <div>Card Two Content</div>
  </div>
</body>
</html>
