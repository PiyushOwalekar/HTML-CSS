<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --bg-color: white;
      --text-color: black;
      --font-size: 16px;
    }

    @media (min-width: 768px) {
      :root {
        --font-size: 24px;
      }
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: var(--font-size);
    }
  </style>
</head>
<body>
  <p>Responsive font</p>
</body>
</html>
