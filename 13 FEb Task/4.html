<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Section</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
}

.hero{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:80px 10%;
    min-height:100vh;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:#fff;
}

.hero-text{
    flex:1;
    animation:slideIn 1s ease forwards;
    opacity:0;
}

.hero-text h1{
    font-size:48px;
    margin-bottom:20px;
}

.hero-text p{
    font-size:18px;
    margin-bottom:30px;
    max-width:500px;
}

.hero-text button{
    padding:12px 25px;
    border:none;
    background:#ff6b6b;
    color:#fff;
    font-size:16px;
    cursor:pointer;
    border-radius:5px;
    animation:pulse 2s infinite;
}

.hero-image{
    flex:1;
    text-align:right;
}

.hero-image img{
    width:400px;
    max-width:100%;
    animation:fadeIn 1.5s ease forwards;
}

@keyframes slideIn{
    from{
        transform:translateX(-50px);
        opacity:0;
    }
    to{
        transform:translateX(0);
        opacity:1;
    }
}

@keyframes pulse{
    0%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.08);
    }
    100%{
        transform:scale(1);
    }
}

@keyframes fadeIn{
    from{
        opacity:0;
    }
    to{
        opacity:1;
    }
}

@media(max-width:768px){
    .hero{
        flex-direction:column;
        text-align:center;
    }

    .hero-image{
        margin-top:40px;
        text-align:center;
    }
}
</style>
</head>

<body>

<section class="hero">
    <div class="hero-text">
        <h1>Modern Websites</h1>
        <p>Timepass</p>
        <button>Get Started</button>
    </div>

    <div class="hero-image">
        <img src="https://i.pinimg.com/736x/34/fa/d0/34fad0e87cb8e563896e062398e617d9.jpg" alt="Hero Image">
    </div>
</section>

</body>
</html>
