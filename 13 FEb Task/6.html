<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asymmetrical Gallery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f6f8;
    padding:40px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    grid-auto-rows:200px;
    gap:15px;
}

.gallery div{
    overflow:hidden;
    border-radius:10px;
}

.gallery img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:grayscale(100%);
    transition:0.5s ease;
}

.gallery div:hover img{
    filter:grayscale(0%);
    transform:scale(1.05);
}

.wide{
    grid-column:span 2;
}

.tall{
    grid-row:span 2;
}

.big{
    grid-column:span 2;
    grid-row:span 2;
}

@media(max-width:768px){
    .gallery{
        grid-template-columns:repeat(2, 1fr);
        grid-auto-rows:150px;
    }
}

@media(max-width:480px){
    .gallery{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="gallery">
    <div class="big"><img src="https://i.pinimg.com/736x/e9/ae/c5/e9aec5441ceb0917f37742259f3164ea.jpg"></div>
    <div class="wide"><img src="https://i.pinimg.com/736x/a5/52/14/a55214735b79fd745f281e719dd26d43.jpg"></div>
    <div><img src="https://i.pinimg.com/736x/05/37/f0/0537f02b88aec6217e09e5f2d9f661ee.jpg"></div>
    <div class="tall"><img src="https://i.pinimg.com/736x/9f/a2/c5/9fa2c5264bf85f8b29133d1fb1450e30.jpg"></div>
    <div><img src="https://i.pinimg.com/736x/30/79/a2/3079a25aa14379fca6119cd923556d95.jpg"></div>
    <div class="wide"><img src="https://i.pinimg.com/736x/66/29/25/662925f758815adaef335a5a0012635b.jpg"></div>
    <div><img src="https://i.pinimg.com/originals/c0/c2/e6/c0c2e6deec3b0a6b25583cae61956611.png"></div>
</div>

</body>
</html>
