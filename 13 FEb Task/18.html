<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-commerce Layout</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
}

.container{
    display:grid;
    grid-template-columns:250px 1fr;
    gap:30px;
    padding:40px 8%;
}

.sidebar{
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.05);
    height:fit-content;
}

.sidebar h3{
    margin-bottom:15px;
}

.sidebar ul{
    list-style:none;
}

.sidebar li{
    margin-bottom:10px;
}

.sidebar a{
    text-decoration:none;
    color:#555;
    font-size:14px;
    transition:0.3s;
}

.sidebar a:hover{
    color:#0072ff;
    padding-left:5px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:25px;
}

.card{
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
    display:flex;
    flex-direction:column;
    transition:0.3s ease;
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card-content{
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
    flex:1;
}

.card h4{
    font-size:16px;
}

.price{
    font-weight:bold;
    color:#0072ff;
}

.btn{
    margin-top:auto;
    padding:10px;
    border:none;
    border-radius:25px;
    background:#0072ff;
    color:#fff;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:0.3s ease;
}

.btn::after{
    content:"Add to Cart";
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#00c6ff;
    transform:translateY(100%);
    transition:0.3s ease;
}

.btn:hover::after{
    transform:translateY(0);
}

.btn:hover{
    color:transparent;
}

@media(max-width:900px){
    .container{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <aside class="sidebar">
        <h3>Categories</h3>
        <ul>
            <li><a href="#">Electronics</a></li>
            <li><a href="#">Fashion</a></li>
            <li><a href="#">Home</a></li>
            <li><a href="#">Sports</a></li>
            <li><a href="#">Accessories</a></li>
        </ul>
    </aside>

    <section class="products">

        <div class="card">
            <img src="https://i.pinimg.com/1200x/85/4e/66/854e66cd2d06f4dee73903f26827ec99.jpg">
            <div class="card-content">
                <h4>Bumbulbee</h4>
                <span class="price">$49.99</span>
                <button class="btn">Buy Now</button>
            </div>
        </div>

        <div class="card">
            <img src="https://i.pinimg.com/736x/21/8f/89/218f894a5be40c465d1a9cd051d1044d.jpg">
            <div class="card-content">
                <h4>Truck wala</h4>
                <span class="price">$69.99</span>
                <button class="btn">Buy Now</button>
            </div>
        </div>

        <div class="card">
            <img src="https://i.pinimg.com/736x/f7/31/52/f7315257812fabafd521df5d59c3a579.jpg">
            <div class="card-content">
                <h4>Electron</h4>
                <span class="price">$89.99</span>
                <button class="btn">Buy Now</button>
            </div>
        </div>

        <div class="card">
            <img src="https://i.pinimg.com/1200x/f5/94/44/f59444e647fd7b834d3b28a6320777fc.jpg">
            <div class="card-content">
                <h4>Stellman</h4>
                <span class="price">$39.99</span>
                <button class="btn">Buy Now</button>
            </div>
        </div>

    </section>

</div>

</body>
</html>
