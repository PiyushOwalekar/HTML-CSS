<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flip Card Animation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1f4037,#99f2c8);
}

.card-container{
    perspective:1000px;
}

.card{
    width:300px;
    height:400px;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.8s;
}

.card-container:hover .card{
    transform:rotateY(180deg);
}

.face{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:15px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:30px;
    backface-visibility:hidden;
    color:#fff;
}

.front{
    background:linear-gradient(135deg,#ff416c,#ff4b2b);
}

.back{
    background:linear-gradient(135deg,#141e30,#243b55);
    transform:rotateY(180deg);
}

h2{
    margin-bottom:15px;
    letter-spacing:1px;
}

p{
    text-align:center;
    font-size:14px;
    line-height:1.6;
}

button{
    margin-top:20px;
    padding:10px 25px;
    border:none;
    border-radius:25px;
    background:#fff;
    color:#333;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-4px);
    box-shadow:0 8px 18px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<div class="card-container">
    <div class="card">
        <div class="face front">
            <h2>Front Side</h2>
            <p>black</p>
            <button>Learn More</button>
        </div>
        <div class="face back">
            <h2>Back Side</h2>
            <p>Red</p>
            <button>Go Back</button>
        </div>
    </div>
</div>

</body>
</html>
