<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Bars</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#141e30,#243b55);
    padding:40px;
}

.wrapper{
    width:100%;
    max-width:600px;
    display:flex;
    flex-direction:column;
    gap:30px;
}

.progress-item{
    display:flex;
    flex-direction:column;
    gap:8px;
    color:#fff;
}

.label{
    display:flex;
    justify-content:space-between;
    font-size:14px;
}

.bar{
    width:100%;
    height:14px;
    background:rgba(255,255,255,0.15);
    border-radius:20px;
    overflow:hidden;
}

.fill{
    height:100%;
    width:0;
    border-radius:20px;
    animation:fillAnim 2s ease forwards;
}

.fill.html{ background:#ff4b2b; width:90%; }
.fill.css{ background:#00c6ff; width:80%; }
.fill.js{ background:#f7df1e; width:70%; }
.fill.react{ background:#61dafb; width:65%; }

@keyframes fillAnim{
    from{ width:0; }
}

@media(max-width:600px){
    .wrapper{
        gap:20px;
    }
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="progress-item">
        <div class="label">
            <span>HTML</span>
            <span>90%</span>
        </div>
        <div class="bar">
            <div class="fill html"></div>
        </div>
    </div>

    <div class="progress-item">
        <div class="label">
            <span>CSS</span>
            <span>80%</span>
        </div>
        <div class="bar">
            <div class="fill css"></div>
        </div>
    </div>

    <div class="progress-item">
        <div class="label">
            <span>JabhaScript</span>
            <span>70%</span>
        </div>
        <div class="bar">
            <div class="fill js"></div>
        </div>
    </div>

    <div class="progress-item">
        <div class="label">
            <span>C++</span>
            <span>65%</span>
        </div>
        <div class="bar">
            <div class="fill react"></div>
        </div>
    </div>

</div>

</body>
</html>
