<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing Table</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f6f8;
    padding:60px 10%;
}

.pricing{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:30px;
    flex-wrap:wrap;
}

.card{
    background:#fff;
    padding:40px 30px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
    flex:1;
    max-width:300px;
    transition:0.3s;
}

.card h2{
    margin-bottom:15px;
}

.card .price{
    font-size:32px;
    margin:20px 0;
}

.card ul{
    list-style:none;
    margin:20px 0;
}

.card ul li{
    margin:10px 0;
}

.card button{
    padding:10px 20px;
    border:none;
    cursor:pointer;
    border-radius:5px;
    background:#333;
    color:#fff;
}

.card:hover{
    transform:translateY(-10px);
}

.highlight{
    color:#fff;
    background:linear-gradient(45deg,#ff6a00,#ee0979);
    background-size:200% 200%;
    animation:gradientMove 4s ease infinite;
    transform:scale(1.05);
}

.highlight button{
    background:#fff;
    color:#ee0979;
}

@keyframes gradientMove{
    0%{
        background-position:0% 50%;
    }
    50%{
        background-position:100% 50%;
    }
    100%{
        background-position:0% 50%;
    }
}

@media(max-width:768px){
    .pricing{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="pricing">

    <div class="card">
        <h2>Basic</h2>
        <div class="price">$19/mo</div>
        <ul>
            <li>10 Projects</li>
            <li>5 GB Storage</li>
            <li>Email Support</li>
        </ul>
        <button>Select</button>
    </div>

    <div class="card highlight">
        <h2>Pro</h2>
        <div class="price">$49/mo</div>
        <ul>
            <li>50 Projects</li>
            <li>25 GB Storage</li>
            <li>Priority Support</li>
        </ul>
        <button>Select</button>
    </div>

    <div class="card">
        <h2>Premium</h2>
        <div class="price">$99/mo</div>
        <ul>
            <li>Unlimited Projects</li>
            <li>100 GB Storage</li>
            <li>24/7 Support</li>
        </ul>
        <button>Select</button>
    </div>

</div>

</body>
</html>
