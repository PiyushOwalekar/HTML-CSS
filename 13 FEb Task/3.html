<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3x3 Product Grid</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f6f8;
    padding:40px;
}

.grid-container{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:20px;
}

.card{
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
    transition:transform 0.3s ease;
}

.image-wrapper{
    overflow:hidden;
}

.image-wrapper img{
    width:100%;
    display:block;
    transition:transform 0.4s ease;
}

.card:hover img{
    transform:scale(1.1);
}

.card-content{
    padding:15px;
    text-align:center;
}

.card-content h3{
    margin-bottom:10px;
}

.card-content p{
    color:gray;
    font-size:14px;
}

@media(max-width:768px){
    .grid-container{
        grid-template-columns:repeat(2, 1fr);
    }
}

@media(max-width:480px){
    .grid-container{
        grid-template-columns:repeat(1, 1fr);
    }
}
</style>
</head>

<body>

<div class="grid-container">

    <div class="card">
        <div class="image-wrapper">
            <img src="https://i.pinimg.com/736x/cf/66/d4/cf66d41582586eb63e546051bc1eb6ea.jpg">
        </div>
        <div class="card-content">
            <h3>Product 1</h3>
            <p>$10</p>
        </div>
    </div>

    <div class="card">
        <div class="image-wrapper">
            <img src="https://i.pinimg.com/736x/1e/14/f8/1e14f84e573c47dbe911a2ba32ea6418.jpg">
        </div>
        <div class="card-content">
            <h3>Product 2</h3>
            <p>$20</p>
        </div>
    </div>

    <div class="card">
        <div class="image-wrapper">
            <img src="https://i.pinimg.com/736x/77/c0/ea/77c0eaa87f41f745c0f1277b9f55ec90.jpg">
        </div>
        <div class="card-content">
            <h3>Product 3</h3>
            <p>$39</p>
        </div>
    </div>

    <div class="card">
        <div class="image-wrapper">
            <img src="https://i.pinimg.com/736x/76/61/fa/7661fa916f652b974df42620d6093eba.jpg">
        </div>
        <div class="card-content">
            <h3>Product 4</h3>
            <p>$29</p>
        </div>
    </div>

    <div class="card">
        <div class="image-wrapper">
            <img src="https://i.pinimg.com/1200x/95/c7/b2/95c7b22cb8f8571147a4c4ab0c1649d4.jpg">
        </div>
        <div class="card-content">
            <h3>Product 5</h3>
            <p>$79</p>
        </div>
    </div>

    <div class="card">
        <div class="image-wrapper">
            <img src="https://i.pinimg.com/1200x/8e/9b/32/8e9b32924a9f7b182325027c960c9ef7.jpg">
        </div>
        <div class="card-content">
            <h3>Product 6</h3>
            <p>$89</p>
        </div>
    </div>

    <div class="card">
        <div class="image-wrapper">
            <img src="https://i.pinimg.com/1200x/a6/4d/ff/a64dff5f03010ea75bac4c8185ffa84c.jpg">
        </div>
        <div class="card-content">
            <h3>Product 7</h3>
            <p>$67</p>
        </div>
    </div>

    <div class="card">
        <div class="image-wrapper">
            <img src="https://i.pinimg.com/1200x/43/18/d8/4318d8f5501a5b97739cfcb0e6ec5ad5.jpg">
        </div>
        <div class="card-content">
            <h3>Product 8</h3>
            <p>$69</p>
        </div>
    </div>

    <div class="card">
        <div class="image-wrapper">
            <img src="https://i.pinimg.com/736x/bf/f9/25/bff925509b61d53644a960f32651d4b6.jpg">
        </div>
        <div class="card-content">
            <h3>Product 9</h3>
            <p>$99</p>
        </div>
    </div>

</div>

</body>
</html>
