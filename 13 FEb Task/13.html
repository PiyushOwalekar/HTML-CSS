<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Buttons Collection</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#141e30,#243b55);
}

.container{
    display:flex;
    gap:30px;
    flex-wrap:wrap;
    justify-content:center;
}

button{
    padding:14px 32px;
    border:none;
    cursor:pointer;
    font-size:15px;
    letter-spacing:1px;
    border-radius:40px;
    transition:0.4s ease;
    position:relative;
    overflow:hidden;
}

.btn1{
    background:#ff4b2b;
    color:#fff;
}

.btn1:hover{
    transform:translateY(-6px);
    box-shadow:0 12px 25px rgba(0,0,0,0.3);
}

.btn2{
    background:#fff;
    color:#333;
}

.btn2::before{
    content:"";
    position:absolute;
    width:0%;
    height:100%;
    left:0;
    top:0;
    background:#00c6ff;
    z-index:-1;
    transition:0.4s;
}

.btn2:hover::before{
    width:100%;
}

.btn2:hover{
    color:#fff;
}

.btn3{
    background:transparent;
    color:#fff;
    border:2px solid #fff;
}

.btn3:hover{
    background:#fff;
    color:#141e30;
    transform:scale(1.1);
}

.btn4{
    background:#00f2fe;
    color:#000;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(0,242,254,0.7);}
    70%{box-shadow:0 0 0 15px rgba(0,242,254,0);}
    100%{box-shadow:0 0 0 0 rgba(0,242,254,0);}
}

.btn5{
    background:#764ba2;
    color:#fff;
}

.btn5::after{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    left:-100%;
    top:0;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,0.6),transparent);
    transition:0.5s;
}

.btn5:hover::after{
    left:100%;
}
</style>
</head>

<body>

<div class="container">
    <button class="btn1">Hover Lift</button>
    <button class="btn2">Slide Fill</button>
    <button class="btn3">Scale Outline</button>
    <button class="btn4">Pulse Glow</button>
    <button class="btn5">Shine Effect</button>
</div>

</body>
</html>
