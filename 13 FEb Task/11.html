<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced CSS Loader</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:Arial, sans-serif;
    background:linear-gradient(270deg,#ff6a00,#ee0979,#00c6ff,#0072ff);
    background-size:600% 600%;
    animation:bgShift 10s ease infinite;
    color:#fff;
}

.loader{
    position:relative;
    width:120px;
    height:120px;
    margin-bottom:30px;
}

.ring{
    position:absolute;
    width:100%;
    height:100%;
    border:6px solid transparent;
    border-top:6px solid #fff;
    border-radius:50%;
    animation:rotate 1.5s linear infinite;
}

.ring:nth-child(2){
    width:90px;
    height:90px;
    top:15px;
    left:15px;
    border-top:6px solid #00ffff;
    animation:rotateReverse 2s linear infinite;
}

.core{
    position:absolute;
    width:25px;
    height:25px;
    background:#fff;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    animation:pulse 1.5s ease-in-out infinite;
}

h2{
    font-weight:300;
    letter-spacing:2px;
    animation:textFade 2s ease-in-out infinite alternate;
}

@keyframes rotate{
    100%{
        transform:rotate(360deg);
    }
}

@keyframes rotateReverse{
    100%{
        transform:rotate(-360deg);
    }
}

@keyframes pulse{
    0%,100%{
        transform:translate(-50%,-50%) scale(1);
        opacity:1;
    }
    50%{
        transform:translate(-50%,-50%) scale(1.5);
        opacity:0.6;
    }
}

@keyframes bgShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

@keyframes textFade{
    from{opacity:0.6;}
    to{opacity:1;}
}
</style>
</head>

<body>

<div class="loader">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="core"></div>
</div>

<h2>Loading Timepass King Goku</h2>

</body>
</html>
