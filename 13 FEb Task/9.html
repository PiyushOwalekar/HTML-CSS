<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistics Section</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f6f8;
    padding:60px 10%;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:20px;
}

.card{
    background:#fff;
    padding:40px 20px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
    animation:bounce 2s infinite;
}

.card h2{
    font-size:36px;
    margin-bottom:10px;
    color:#333;
}

.card p{
    color:gray;
    font-size:14px;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-15px);
    }
}

@media(max-width:992px){
    .stats{
        grid-template-columns:repeat(2, 1fr);
    }
}

@media(max-width:576px){
    .stats{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="stats">
    <div class="card">
        <h2>120+</h2>
        <p>Projects Completed</p>
    </div>

    <div class="card">
        <h2>80+</h2>
        <p>Happy Clients</p>
    </div>

    <div class="card">
        <h2>15</h2>
        <p>Awards Won</p>
    </div>

    <div class="card">
        <h2>5+</h2>
        <p>Years Experience</p>
    </div>
</div>

</body>
</html>
