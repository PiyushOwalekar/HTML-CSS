<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Segoe UI;
background:linear-gradient(270deg,#0f0c29,#302b63,#24243e);
background-size:600% 600%;
animation:bgMove 15s infinite;
color:white;
}

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.hidden{
display:none;
}

.container{
backdrop-filter:blur(20px);
background:rgba(255,255,255,0.05);
padding:30px;
border-radius:20px;
box-shadow:0 0 40px rgba(0,255,255,0.3);
display:flex;
flex-direction:column;
align-items:center;
gap:20px;
animation:zoom .8s;
}

@keyframes zoom{
from{transform:scale(.5);opacity:0}
to{transform:scale(1);opacity:1}
}

.title{
font-size:35px;
background:linear-gradient(90deg,cyan,magenta);
-webkit-background-clip:text;
color:transparent;
}

.scoreboard{
display:flex;
gap:30px;
font-size:18px;
}

.score{
padding:10px 20px;
border-radius:10px;
background:rgba(0,0,0,0.4);
box-shadow:0 0 15px cyan;
}

.turn{
padding:10px 20px;
border-radius:10px;
background:magenta;
box-shadow:0 0 20px magenta;
animation:pulse 1s infinite alternate;
}

@keyframes pulse{
from{transform:scale(1)}
to{transform:scale(1.1)}
}

.board{
display:grid;
grid-template-columns:repeat(3,100px);
gap:15px;
}

.cell{
width:100px;
height:100px;
display:flex;
justify-content:center;
align-items:center;
font-size:40px;
cursor:pointer;
border-radius:15px;
background:rgba(255,255,255,0.08);
box-shadow:
inset 0 0 10px rgba(255,255,255,0.2),
0 0 20px rgba(0,255,255,0.3);
transition:.3s;
}

.cell:hover{
transform:translateY(-5px) scale(1.05);
box-shadow:
0 0 20px cyan,
0 0 40px magenta;
}

.cell.x-mark { color: #00ffff; text-shadow: 0 0 20px #00ffff; }
.cell.o-mark { color: #ff00ff; text-shadow: 0 0 20px #ff00ff; }

.winning-cell {
    background: rgba(255, 255, 255, 0.2) !important;
    box-shadow: 0 0 30px white !important;
}

button{
padding:12px 25px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
background:linear-gradient(90deg,cyan,magenta);
color:white;
transition:.3s;
}

button:hover{
transform:scale(1.1);
}

.mode-select {
    display: flex;
    gap: 10px;
}

.win{
font-size:30px;
animation:flash .5s infinite alternate;
}

@keyframes flash{
from{text-shadow:0 0 10px cyan}
to{text-shadow:0 0 30px magenta}
}

@media(max-width:600px){

.board{
grid-template-columns:repeat(3,70px);
}

.cell{
width:70px;
height:70px;
}

}

</style>
</head>

<body>

<div class="container" id="start">

<div class="title">TIC TAC TOE</div>

<div class="mode-select">
    <button onclick="startGame('pvp')">Friend</button>
    <button onclick="startGame('pvc')">Ai</button>
</div>

</div>


<div class="container hidden" id="game">

<div class="title">Timepass</div>

<div class="scoreboard">

<div class="score">X : <span id="sx">0</span></div>

<div class="score">O : <span id="so">0</span></div>

</div>

<div class="turn" id="turn">Turn : X</div>

<div class="board">

<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>

</div>

<button onclick="restart()">Restart</button>

</div>


<div class="container hidden" id="over">

<div class="win" id="result"></div>

<button onclick="playAgain()">Play Again</button>

</div>


<script>

let turn="X"
let scoreX=0
let scoreO=0
let moves=0
let active=true
let gameMode = "pvp"

let cells=document.querySelectorAll(".cell")

let win=[
[0,1,2],
[3,4,5],
[6,7,8],
[0,3,6],
[1,4,7],
[2,5,8],
[0,4,8],
[2,4,6]
]

function startGame(mode){
    gameMode = mode;
    start.classList.add("hidden")
    game.classList.remove("hidden")
    if(mode === 'pvc') scoreO = 0, scoreX = 0, updateScores();
}

cells.forEach(cell=>{
cell.onclick=()=>{
    if(cell.innerHTML || !active) return;
    makeMove(cell);
    if(active && gameMode === 'pvc' && turn === "O") {
        active = false; // Temporarily disable clicks
        setTimeout(cpuMove, 500);
    }
}
})

function makeMove(cell) {
    cell.innerHTML = turn;
    cell.classList.add(turn === "X" ? "x-mark" : "o-mark");
    moves++;

    let winningCombo = check();
    if(winningCombo){
        result.innerHTML = turn + " Wins";
        update();
        winningCombo.forEach(index => {
            cells[index].classList.add("winning-cell");
        });
        active = false; // Stop further moves
        setTimeout(() => { game.classList.add("hidden"); over.classList.remove("hidden"); }, 1500);
        return;
    }

    if(moves == 9){
        result.innerHTML = "Draw";
        game.classList.add("hidden");
        over.classList.remove("hidden");
        active = false;
        return;
    }

    turn = turn == "X" ? "O" : "X";
    document.getElementById("turn").innerHTML = "Turn : " + turn;
}

function cpuMove() {
    if(!active && moves < 9) {
        active = true;
        let available = Array.from(cells).filter(c => c.innerHTML === "");
        if(available.length > 0) {
            let randomCell = available[Math.floor(Math.random() * available.length)];
            makeMove(randomCell);
        }
    }
}

function updateScores() {
    sx.innerHTML = scoreX;
    so.innerHTML = scoreO;
}

function check(){

    return win.find(p => p.every(i => cells[i].innerHTML == turn));

}

function update(){

if(turn=="X"){

scoreX++

sx.innerHTML=scoreX

}

else{

scoreO++

so.innerHTML=scoreO

}

}

function playAgain(){
cells.forEach(c=>{
    c.innerHTML=""
    c.className = "cell"
})
    turn="X"
    moves=0
    active=true
    over.classList.add("hidden")
    game.classList.remove("hidden")
    document.getElementById("turn").innerHTML="Turn : X"
}

function restart(){
    cells.forEach(c=>{
        c.innerHTML=""
        c.className = "cell"
    })
turn="X"
moves=0
scoreX=0
scoreO=0
sx.innerHTML=0
so.innerHTML=0

start.classList.add("hidden")

active=true

over.classList.add("hidden")

game.classList.remove("hidden")

document.getElementById("turn").innerHTML="Turn : X"

}

</script>

</body>
</html>
