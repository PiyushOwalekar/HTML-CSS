<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>

    #parent {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
}

#parent div {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    cursor: pointer;
}
    body {
    background: #0f2027;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
    position: relative;
}

.bg-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    display: flex;
    justify-content: space-around;
    align-items: center;
}

.bg-svg svg {
    width: 150px;
    height: 150px;
    fill: rgba(0, 255, 255, 0.1);
    animation: float 10s infinite ease-in-out;
}

@keyframes float {
    0%, 100% {
        transform: translate(0, 0) rotate(0deg);
        fill: rgba(0, 255, 255, 0.1);
    }
    50% {
        transform: translate(20vw, 20vh) rotate(180deg);
        fill: rgba(255, 0, 255, 0.1);
    }
}

#parent {
    border: none;
    padding: 10px;
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    box-shadow:
        0 0 20px cyan,
        0 0 40px rgba(0,255,255,0.5),
        inset 0 0 20px rgba(255,255,255,0.1);
    animation: boardGlow 3s infinite alternate;
}

#parent div {
    border: 2px solid rgba(255,255,255,0.2);
    color: white;
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
    transition: all 0.3s ease;
    box-shadow: inset 0 0 10px rgba(0,255,255,0.3);
}

#parent div:hover {
    background: cyan;
    color: black;
    transform: scale(1.1) rotate(5deg);
    box-shadow:
        0 0 20px cyan,
        0 0 40px cyan;
}

#parent div:active {
    transform: scale(0.9);
}

#parent div:not(:empty){
    animation: textGlow 1s infinite alternate;
}

@keyframes boardGlow {
    from {
        box-shadow:
            0 0 10px cyan,
            inset 0 0 10px white;
    }

    to {
        box-shadow:
            0 0 30px magenta,
            inset 0 0 20px cyan;
    }
}

@keyframes textGlow {
    from {
        text-shadow: 0 0 10px cyan;
    }

    to {
        text-shadow:
            0 0 20px magenta,
            0 0 40px magenta;
    }
}

    </style>
</head>
<body>
    <div class="bg-svg">
        <svg viewBox="0 0 100 100" style="top: 10%; left: 10%; position: absolute;"><circle cx="50" cy="50" r="40" stroke="cyan" stroke-width="2" fill="none"/></svg>
        <svg viewBox="0 0 100 100" style="top: 20%; left: 70%; position: absolute; animation-delay: -2s;"><path d="M20,20 L80,80 M80,20 L20,80" stroke="magenta" stroke-width="5"/></svg>
        <svg viewBox="0 0 100 100" style="top: 60%; left: 15%; position: absolute; animation-delay: -5s;"><circle cx="50" cy="50" r="40" stroke="cyan" stroke-width="2" fill="none"/></svg>
        <svg viewBox="0 0 100 100" style="top: 70%; left: 80%; position: absolute; animation-delay: -7s;"><path d="M20,20 L80,80 M80,20 L20,80" stroke="magenta" stroke-width="5"/></svg>
    </div>

    <div id="parent">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>
    <script src="JabhaScript18FEB.js"></script>
</body>
</html>
